name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same image as everywhere else (Dockerfile): building it runs the tests and the offline build.
      - run: docker build -t near-real-usage .
      # Every run starts from the committed copies of the data, which are older than the page a daily run published.
      # If a source cannot be downloaded the run stops here, whatever started it (schedule, push or by hand), and the
      # page of the last good run stays in place. To publish from the committed copies, run `make offline` locally.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" near-real-usage
          python -m thesis build --require-fresh
      # The replies this page was built from go out with it (docs/inputs/), with the commit that built it, so that the
      # published page can be rebuilt offline from them while it is up. Earlier daily pages and their inputs are not kept.
      - run: |
          mkdir -p docs/inputs
          cp -r data/raw data/daily.csv docs/inputs/
          git rev-parse HEAD > docs/inputs/COMMIT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
