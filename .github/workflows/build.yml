name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same image as everywhere else (Dockerfile): building it runs the tests and the offline build.
      - run: docker build -t near-real-usage .
      # A scheduled run starts from the committed copies of the data. If a source cannot be downloaded it stops here and
      # the page of the last good run stays in place; a push or a manual run falls back to the committed copies instead.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" near-real-usage
          python -m thesis build ${{ github.event_name == 'schedule' && '--require-fresh' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
